# The skill grounds: a sandbox for training skills, played in real time at
# x1. One open place: the player starts in the middle, a clearing, with six
# zones in a ring about 25 m out (twenty seconds' walk), each holding
# everything its own skills need, so nothing is fetched from another zone.
# Where two skills need the same thing (wood, stones, flint), each zone has
# its own. See docs/challenges/skill-grounds.md.
#
#                       the woodland (north)
#                  felling, hunting, and hide
#   the knapping ground                 the fibre grove
#   stone tools                         rope and shelter
#                       the clearing
#                         (start)
#   the hearth                          the stream bank
#   fire                                water and food
#                        the forge (south)
#                   a knife (an axe head) from ore
#
# Gathering takes seconds, and food a minute or so, so the whole ladder can
# be played in an evening.

uses = ["island-things.toml"]

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
max_touch_temperature = "330 K"
seed = 1
air_clearing = "0.1%"
calm_step = "1 min"
convection = "10 W/(m2*K)"
emissivity = "90%"
touch_transfer = "100 W/(m2*K)"
wear_rate = "10 mg/s"
friction_share = "50%"
rubbing_time = "10 min"
flame_share = "50%"
hand_hardness = "1"
explore_time = "30 min"
explore_chance = "60%"
lapse_rate = "6.5 K/km"
planet_radius = "6371 km"
eye_height = "1.7 m"
survey_time = "10 min"
wound_rate = "20 g/s"
hit_chance = "60%"
hand_push = "5%"
drag = "300%"
day = "24 h"
starts_at = "8 h"
sunrise = "6 h"
sunset = "18 h"
# Ground rough enough to hurt bare feet: the mountain's stony paths. Sand
# and the forest floor don't. Each place's roughness is how much of a sole a
# km of walking there wears away.
bare_feet_limit = "8 g/km"
bare_feet_pace = "50%"
bare_feet_wound = "20 mg/s"
covers = "2 kg"

# One open place. Each zone's middle is 25 m from the clearing; its stocks
# lie within 2 m of that middle, so all are in reach from it; and its
# landmark, a big flat rock, stands just behind, so "go to the hearth" from
# the clearing stops in the middle of the hearth's things.
[[place]]
id = "grounds"
label = "the skill grounds"
exits = ["deep-woods"]
distances = { deep-woods = "40 m" }
east = "0 m"
north = "0 m"
size = "35 m"
temperature = "300 K"
night = "292 K"

[[agent]]
id = "player"
label = "the islander"
at = "grounds"
kind = "human"
culture = "islanders"
temperature = "310 K"
rules = "player"

