# The "living with the island" challenge: the castaway's island, known now,
# where a person lives rather than just survives. See
# docs/challenges/living-with-the-island.md. It's the where-am-I? island
# (where-am-i.toml), mountain and view included, shared through
# island-things.toml, with an islander who knows the way around. This file
# grows stage by stage.
#
# Stage 1, shelter: a lean-to of six sticks and four lumps of plant fibre
# keeps in 60% of a sleeper's body heat.
#
# Stage 2, animals: the islander is a human, and six boars keep to the
# forest, the stream, the hillside, and the slopes. Their kinds, bodies, and
# instinct are in island-things.toml. Boars root up roots and nuts, which
# grow back from the forest floor with sunlight.

uses = ["island-things.toml"]

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
max_touch_temperature = "330 K"
seed = 1
air_clearing = "0.1%"
calm_step = "1 min"
convection = "10 W/(m2*K)"
emissivity = "90%"
touch_transfer = "100 W/(m2*K)"
wear_rate = "10 mg/s"
friction_share = "50%"
rubbing_time = "10 min"
flame_share = "50%"
hand_hardness = "1"
explore_time = "30 min"
explore_chance = "60%"
lapse_rate = "6.5 K/km"
planet_radius = "6371 km"
eye_height = "1.7 m"
survey_time = "10 min"
hand_push = "5%"
drag = "300%"
day = "24 h"
starts_at = "8 h"
sunrise = "6 h"
sunset = "18 h"

[[place]]
id = "beach"
label = "the beach"
exits = ["stream", "forest", "islet"]
distances = { stream = "400 m", forest = "300 m", islet = "2 km" }
crossings = { islet = "sea" }
temperature = "300 K"
night = "292 K"
east = "0 m"
north = "0 m"

[[place]]
id = "stream"
label = "the stream"
exits = ["beach", "forest"]
distances = { forest = "300 m" }
height = "20 m"
temperature = "300 K"
night = "292 K"
east = "-300 m"
north = "-250 m"

[[place]]
id = "forest"
label = "the forest"
exits = ["beach", "stream", "hillside"]
