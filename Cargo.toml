[workspace]
resolver = "3"
members = ["crates/engine", "crates/console"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
proptest = "1"

# The challenge tests simulate many days; build tests optimised so they run
# in seconds rather than minutes.
[profile.test]
opt-level = 3
