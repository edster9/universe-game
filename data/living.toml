height = "1200 m"
temperature = "300 K"
night = "292 K"
east = "-9.5 km"
north = "2 km"

[[place]]
id = "summit"
label = "the summit"
exits = ["ridge"]
height = "1800 m"
temperature = "300 K"
night = "292 K"
east = "-12 km"
north = "3 km"
from_afar = "a mountain, its top bare rock"

[[place]]
