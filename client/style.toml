size = 2.2
models = [
    "third-party/quaternius/stylized-nature-megakit/glTF/Rock_Medium_1.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Rock_Medium_2.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Rock_Medium_3.gltf",
]
scale = 0.8
most = 1
smaller = [{ under = 50000.0, form = "nugget", size = 0.3 }]

# Things built to a design.
[design.fire-ring]
form = "ring"
colour = "#8a8a8a"
size = 1.0

[design.furnace]
form = "kiln"
colour = "#a0522d"
size = 1.1

# Anything not listed.
[fallback]
form = "rock"
colour = "#b0a090"
size = 0.3

