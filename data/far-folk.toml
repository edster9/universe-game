# The far-folk: a people who work metal and sail, from across the sea. They
# know iron, rope, and the sea, and call a sharp chip a barb, but have never
# seen flint, a shaft, or a spear. Their words, for any world where one of
# them washes up. See docs/challenges/strangers-words.md.

[[culture]]
id = "far-folk"
knows = [
    "water", "seawater", "wood", "stone", "rock", "iron", "fibre",
    "flesh", "meat", "cooked-meat", "fat", "hide", "bone", "fish", "shell",
    "flake", "rope", "pot", "paddle",
    "animal", "tree", "human",
]
words = { flake = "barb" }
