# Slice 1: matter and processes, in a world with iron ore.
#
# Everything the engine knows about these materials is in this file. Swap it
# for slice1-copper.toml and the same commands make copper instead.
#
# Temperatures in kelvin (293 K is room temperature). Hardness is on a scale
# where a tool only works material softer than itself; it falls as a material
# heats, reaching zero at its melting point.

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
dig_amount = "5 kg"
max_touch_temperature = "330 K"

[[material]]
id = "iron"
label = "iron"
melting_point = "1811 K"
boiling_point = "3134 K"
specific_heat = "449 J/(kg*K)"
hardness = "4"
density = "7874 kg/m3"
speed_of_sound = "5120 m/s"

[[material]]
id = "rock"
label = "rock"
melting_point = "2200 K"
boiling_point = "3200 K"
specific_heat = "800 J/(kg*K)"
hardness = "5"
density = "2700 kg/m3"
speed_of_sound = "5000 m/s"

[[material]]
id = "gold"
label = "gold"
melting_point = "1337 K"
boiling_point = "3129 K"
specific_heat = "129 J/(kg*K)"
hardness = "2.5"
density = "19300 kg/m3"
speed_of_sound = "3240 m/s"

[[material]]
id = "charcoal"
label = "charcoal"
melting_point = "3800 K"
boiling_point = "4200 K"
specific_heat = "1000 J/(kg*K)"
hardness = "1"
energy_density = "30 MJ/kg"
burns_to = { smoke = "95%", ash = "5%" }
density = "300 kg/m3"

[[material]]
id = "ash"
label = "ash"
melting_point = "2300 K"
boiling_point = "3500 K"
specific_heat = "800 J/(kg*K)"
hardness = "1"

[[material]]
id = "smoke"
label = "smoke"
