# The "where am I?" challenge: someone wakes on a beach with nothing, and
# doesn't know where they are. See docs/challenges/where-am-i.md. It's the
# stranded island (stranded.toml), shared through island-things.toml, with a
# castaway who has to find their way. This file grows stage by stage.
#
# Stage 1, day, night, and sleep: as on the stranded island. 24 hours, the sun
# up from 06:00 to 18:00, starting at 08:00; 300 K at midday and 292 K at
# midnight. A body stays awake 16 hours for 8 hours' sleep.
#
# Stage 2, an unknown island: the castaway knows no way out of anywhere. One
# search around takes 30 minutes and finds the nearest unknown way out six
# times in ten. Walking a way teaches the way back.

uses = ["island-things.toml"]

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
max_touch_temperature = "330 K"
seed = 1
air_clearing = "0.1%"
calm_step = "1 min"
convection = "10 W/(m2*K)"
emissivity = "90%"
touch_transfer = "100 W/(m2*K)"
wear_rate = "10 mg/s"
friction_share = "50%"
rubbing_time = "10 min"
flame_share = "50%"
hand_hardness = "1"
explore_time = "30 min"
explore_chance = "60%"
hand_push = "5%"
drag = "300%"
day = "24 h"
starts_at = "8 h"
sunrise = "6 h"
sunset = "18 h"

[[place]]
id = "beach"
label = "the beach"
exits = ["stream", "forest", "islet"]
distances = { stream = "400 m", forest = "300 m", islet = "2 km" }
crossings = { islet = "sea" }
temperature = "300 K"
night = "292 K"

[[place]]
id = "stream"
label = "the stream"
exits = ["beach", "forest"]
distances = { forest = "300 m" }
temperature = "300 K"
night = "292 K"

[[place]]
id = "forest"
label = "the forest"
exits = ["beach", "stream", "hillside"]
distances = { hillside = "500 m" }
temperature = "300 K"
night = "292 K"

[[place]]
id = "hillside"
label = "the hillside"
exits = ["forest"]
temperature = "300 K"
night = "292 K"

[[place]]
id = "islet"
label = "the next island"
exits = ["beach"]
temperature = "300 K"
night = "292 K"

[[agent]]
id = "survivor"
label = "the castaway"
at = "beach"
lost = true
mass = "70 kg"
composition = { water = "60%", flesh = "26%", fat = "14%" }
temperature = "310 K"
life = { resting_power = "80 W", working_power = "300 W", heat_loss = "8 W/K", set_point = "310 K", sweat_rate = "1.5 kg/h", sweat_heat = "2.4 MJ/kg", fluid = "water", fluid_loss = "2 kg/day", fluid_minimum = "35 kg", digests = ["fat", "shellfish", "fish"], gulp = "0.5 kg", coldest = "303 K", hottest = "316 K", carry = "40 kg", walk = "1.2 m/s", awake = "16 h", sleep = "8 h", tired_pace = "67%", collapse = "40 h" }

[[item]]
id = "sea"
label = "the sea"
at = "beach"
mass = "1000 t"
fixed = true
material = "seawater"

[[item]]
id = "shellfish-bed"
label = "shellfish on the rocks"
at = "beach"
mass = "60 kg"
fixed = true
composition = { shellfish = "35%", shell = "65%" }
pieces = { size = "1 kg", find_time = "10 min" }
grows = { rate = "5%", limit = "80 kg", from = "sea" }

[[item]]
id = "water"
label = "the stream's water"
at = "stream"
mass = "50 t"
fixed = true
material = "water"

[[item]]
id = "driftwood"
label = "driftwood on the sand"
at = "beach"
mass = "100 kg"
fixed = true
material = "wood"
pieces = { size = "2 kg", find_time = "15 min" }

[[item]]
id = "grass"
label = "dry grass"
at = "forest"
mass = "20 kg"
fixed = true
material = "grass"
pieces = { size = "5 g", find_time = "2 min" }

[[item]]
id = "twigs"
label = "dry twigs"
at = "forest"
mass = "20 kg"
fixed = true
material = "wood"
pieces = { size = "20 g", find_time = "3 min" }

[[item]]
id = "sticks"
label = "fallen sticks"
at = "forest"
mass = "50 kg"
fixed = true
material = "wood"
pieces = { size = "200 g", find_time = "10 min" }

[[item]]
id = "stones"
label = "loose stones"
at = "hillside"
mass = "500 kg"
fixed = true
material = "stone"
pieces = { size = "1 kg", find_time = "5 min" }

[[item]]
id = "fish"
label = "fish in the shallows"
at = "beach"
mass = "150 kg"
fixed = true
material = "fish"
pieces = { size = "500 g", find_time = "15 min", chance = "60%", needs = "spear" }
grows = { rate = "5%", limit = "300 kg", from = "sea" }

[[item]]
id = "flint"
label = "flint nodules"
at = "hillside"
mass = "200 kg"
fixed = true
material = "flint"
pieces = { size = "500 g", find_time = "10 min" }

[[item]]
id = "bog-iron"
label = "bog iron in the streambed"
at = "stream"
mass = "200 kg"
fixed = true
composition = { iron = "50%", rock = "50%" }
pieces = { size = "2 kg", find_time = "10 min" }

[[item]]
id = "clay-bank"
label = "clay in the bank"
at = "stream"
mass = "500 kg"
fixed = true
material = "clay"
pieces = { size = "1 kg", find_time = "5 min" }

[[item]]
id = "trees"
label = "standing trees"
at = "forest"
mass = "20 t"
fixed = true
material = "wood"
pieces = { size = "20 kg", find_time = "1 h", edge = "1 mm", needs = "axe" }

[[item]]
id = "bushes"
label = "fibrous bushes"
at = "forest"
mass = "500 kg"
fixed = true
material = "fibre"
pieces = { size = "250 g", find_time = "20 min" }
