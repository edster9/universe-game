# Slice 2: parts and datasheets, in a small workshop.
#
# Shapes have roles, which decide what the engine measures about them:
# cutting (edge width, edge hardness), holding, conducting (resistance),
# glowing (resistance, and whether it gives light), source (voltage, stored
# energy), and touching (surface roughness, which sets resistance where two
# surfaces meet).
#
# Designs say which parts go together. When parts are assembled, the engine
# measures the result once, from the parts' datasheets, and keeps that
# datasheet. A design can use another design as a part.
#
# Tolerances say how closely a part matches its shape: smaller is finer.
# Something made with a tool is at best as fine as the tool. Rubbing two
# parts together makes both finer, slowly.

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
dig_amount = "5 kg"
max_touch_temperature = "330 K"
rough_tolerance = "5 mm"
finest_tolerance = "1 um"
rubbing_improvement = "20%"
rubbing_time = "10 min"
touch_resistance = "1 mOhm/um"
glow_temperature = "1000 K"

