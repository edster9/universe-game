# How the first scene draws things: a colour and a simple form for each
# material and each kind of creature, until the game has real assets (see
# docs/ideas/assets.md). The engine never draws; this is the client's own
# data, keyed by the ids in the world's data files.
#
# Forms made in code (client/src/shapes.rs): twig, stick, log, tuft (grass
# blades), stone, shard (knapped-looking, for flint), nugget (lumpy ore),
# boulder (a big flat rock), shell, nuts (roots and nuts), bush, pine (a
# tree), ring (stones in a circle), kiln (a furnace). Simple ones: rock (a
# ball), pool (a flat patch of liquid), mound (a low heap), person, beast,
# none (not drawn). `size` is a piece's size in metres. `smaller` gives other
# forms for lighter pieces, by weight in grams: a twig, a stick. Things built
# to a design are drawn by `[design.<id>]`.
#
# Some things are drawn with models from Quaternius' Stylized Nature MegaKit
# (CC0), on trial (docs/ideas/assets.md): `models` lists glTF files under
# the client's assets folder, one picked per piece, at their own size times
# `scale`; `most` caps how many pieces are drawn and `over` how far apart.
# Where the files aren't there, the shape is drawn instead.

[kind.human]
form = "person"
colour = "#d9a066"
size = 1.75

[kind.boar]
form = "beast"
colour = "#5a3a22"
size = 0.9

[kind.tree]
form = "pine"
colour = "#2e6b30"
size = 9.0
models = [
    "third-party/quaternius/stylized-nature-megakit/glTF/CommonTree_1.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/CommonTree_2.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/CommonTree_3.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/CommonTree_4.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/CommonTree_5.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Pine_1.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Pine_2.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Pine_3.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Pine_4.gltf",
    "third-party/quaternius/stylized-nature-megakit/glTF/Pine_5.gltf",
]
most = 4
over = 5.0

# The plain bush borrows the twisted tree's red autumn leaves; the
# flowering one is green.
[kind.shrub]
form = "bush"
colour = "#3f8f3a"
size = 1.6
models = [
    "third-party/quaternius/stylized-nature-megakit/glTF/Bush_Common_Flowers.gltf",
]
scale = 0.7
most = 3
over = 1.8

[kind.shellfish]
