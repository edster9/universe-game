[[command]]
name = "as"
group = "Testing"
summary = "give one command as someone else"
usage = ["as <person> <command>"]
about = """
One command as someone else, hearing how what they started came out."""
examples = ["as stranger gather sticks"]
see = ["become"]

# Topics ------------------------------------------------------------------------------------------

[[topic]]
name = "names"
summary = "how to name things in commands"
about = """
Things are named in your own words, by part of their description: "lump", "dry grass", "the ring". When several things share a name, the nearest is meant, among things on the ground.
"smallest <thing>" and "largest <thing>" choose by size: "put smallest wood in ring" lays the twigs before the sticks.
"#12" names a thing by its number, which menus use.
Only what you can make out can be named: something too far away is only "something small" until you walk closer. Tab completes the names of what you can see."""

[[topic]]
name = "repeat"
summary = "doing a command more than once, or several in a row"
about = """
Any command can be repeated, as a player would ask:
  <command> x3            three times
  <command> 500 g         until you carry that much more (gathering) or less (dropping)
  <command> until full    until you can't any more, or you stop
  drop all                put down everything
  <command>; <command>    one after another: "go to sticks; gather sticks x3"
Each time is a command like any other, checked by the laws, and the first refusal ends the run. "stop" ends it too."""

[[topic]]
name = "tools"
summary = "commands for the person at the keyboard, starting with /"
about = """
Tools start with a slash: they're for you at the keyboard, not the islander. Press / to start one. In the game, "/settings" lists the settings and "/set <name> <value>" (or "/<name> <value>") changes one; "/<name>" alone flips one that's on or off. "/quality low|medium|high|ultra" sets how the scene is drawn. Saving and the designer's tools: /save, /load, /saves, /make, /light, /place ("help /make" and so on)."""

[[topic]]
name = "testing"
summary = "commands for testing the engine"
about = """
For testing and development, not play: totals, datasheet, designs, scope, time, log, become, as. "help <command>" for each."""

[[topic]]
name = "keys"
summary = "the game's keys and the console's"
about = """
In the game: WASD walk; right- or middle-drag, or the arrows, to look; the wheel to zoom; a left click on something for what you can do with it, on the ground to walk there; F fly; B backpack; V body; T (held) speak a command; G grid; M build mode; Space pause; [ and ] slower or faster.
The console: Enter to type, Enter to send, Esc to close without sending; / starts a tool; Tab completes; Left, Right, Home, End, Delete, Ctrl+Backspace edit the line; Ctrl+V pastes; Up and Down bring back earlier commands. The wheel over the console, or Page Up and Page Down, scroll back through it; Ctrl+End (or End, when not typing), sending a command, or a click on the "newer lines below" line come back to the newest; Ctrl+Home goes to the oldest. The key left of 1 (`) makes the console bigger, smaller, or hidden."""
