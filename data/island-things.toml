# Kinds of living things: a tree of kinds, each with a parent. A kind can
# give its members a body (mass, composition, and the figures of their life)
# and a mind: members with an instinct act on its rules; others are persons,
# acting on commands. See docs/ideas/kinds.md.

[[kind]]
id = "living-thing"
label = "living thing"

[[kind]]
id = "animal"
label = "animal"
parent = "living-thing"

[[kind]]
id = "mammal"
label = "mammal"
parent = "animal"

[[kind]]
id = "human"
label = "human"
parent = "mammal"
mass = "70 kg"
composition = { water = "60%", flesh = "26%", fat = "14%" }
life = { resting_power = "80 W", working_power = "300 W", heat_loss = "8 W/K", set_point = "310 K", sweat_rate = "1.5 kg/h", sweat_heat = "2.4 MJ/kg", fluid = "water", fluid_loss = "2 kg/day", fluid_minimum = "35 kg", digests = ["fat", "shellfish", "fish"], gulp = "0.5 kg", coldest = "303 K", hottest = "316 K", carry = "40 kg", walk = "1.2 m/s", awake = "16 h", sleep = "8 h", tired_pace = "67%", collapse = "40 h", stores = "75%" }

# A wild boar: 80 kg, fed on roots and nuts it roots up, drinking at water,
# sleeping half the day. It barely sweats. It runs from people.
[[kind]]
id = "boar"
label = "boar"
parent = "mammal"
mass = "80 kg"
composition = { water = "60%", flesh = "25%", fat = "15%" }
life = { resting_power = "90 W", working_power = "250 W", heat_loss = "8 W/K", set_point = "311 K", sweat_rate = "0.3 kg/h", sweat_heat = "2.4 MJ/kg", fluid = "water", fluid_loss = "2 kg/day", fluid_minimum = "40 kg", digests = ["fat", "roots"], gulp = "1 kg", coldest = "303 K", hottest = "317 K", carry = "5 kg", walk = "1.5 m/s", awake = "12 h", sleep = "12 h", tired_pace = "67%", collapse = "36 h", stores = "75%" }
instinct = { flees = ["human"], rest = "30 min", wander = "10%", wary = "3 h" }

