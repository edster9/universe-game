# How the first scene draws things: a colour and a simple form for each
# material and each kind of creature, until the game has real assets (see
# docs/ideas/assets.md). The engine never draws; this is the client's own
# data, keyed by the ids in the world's data files.
#
# Forms made in code (client/src/shapes.rs): twig, stick, log, tuft (grass
# blades), stone, shard (knapped-looking, for flint), nugget (lumpy ore),
# boulder (a big flat rock), shell, nuts (roots and nuts), bush, pine (a
# tree), ring (stones in a circle), kiln (a furnace). Simple ones: rock (a
# ball), pool (a flat patch of liquid), mound (a low heap), person, beast,
# none (not drawn). `size` is a piece's size in metres. `smaller` gives other
# forms for lighter pieces, by weight in grams: a twig, a stick. Things built
# to a design are drawn by `[design.<id>]`.

[kind.human]
form = "person"
colour = "#d9a066"
size = 1.75

[kind.boar]
form = "beast"
colour = "#5a3a22"
size = 0.9

[kind.tree]
form = "pine"
colour = "#2e6b30"
size = 9.0

[kind.shrub]
form = "bush"
colour = "#3f8f3a"
size = 1.6

[kind.shellfish]
form = "shell"
colour = "#2f3440"
size = 0.12

[kind.fish]
form = "none"

[material.wood]
form = "log"
colour = "#8b5a2b"
size = 1.2
smaller = [
    { under = 50.0, form = "twig", size = 0.35 },
    { under = 2000.0, form = "stick", size = 0.9 },
]

[material.stone]
form = "stone"
colour = "#8a8a8a"
size = 0.3

[material.flint]
form = "shard"
colour = "#3b4049"
size = 0.25

[material.iron]
form = "nugget"
colour = "#6b3a2a"
size = 0.3

[material.water]
form = "pool"
colour = "#3a7bd5"
size = 18.0

[material.seawater]
form = "none"

[material.clay]
form = "mound"
colour = "#b5651d"
size = 4.0

[material.litter]
form = "mound"
colour = "#6b4f2a"
size = 30.0

[material.roots]
form = "nuts"
colour = "#7a5a3a"
size = 0.5

[material.grass]
form = "tuft"
colour = "#b7b45a"
size = 0.45

[material.fibre]
form = "bush"
colour = "#6f9a3a"
size = 1.2

[material.shell]
form = "shell"
colour = "#f2eee4"
size = 0.12

[material.shellfish]
form = "shell"
colour = "#e8e2d4"
size = 0.12

# Rock: in big pieces, the skill grounds' landmarks; in small ones, the
# rusty lumps of bog iron (half rock, half iron).
[material.rock]
form = "boulder"
colour = "#7d7468"
size = 2.2
smaller = [{ under = 50000.0, form = "nugget", size = 0.3 }]

# Things built to a design.
[design.fire-ring]
form = "ring"
colour = "#8a8a8a"
size = 1.0

[design.furnace]
form = "kiln"
colour = "#a0522d"
size = 1.1

# Anything not listed.
[fallback]
form = "rock"
colour = "#b0a090"
size = 0.3
