# The catalogue: what each model placed in Blender means to the game
# (docs/ideas/world-building.md). A model of a rock isn't a rock until an
# entry here says so.
#
# Each entry:
#   id      the name placed objects carry (Blender's custom property
#           `ug_entry`, or the collection they're an instance of)
#   is      "scenery" (seen, never used), "source" (many alike, taken from:
#           one thing to the engine), or "thing" (counts on its own)
#   label   its name in the world's own words, unless a placement names it
#   models  model files under assets/third-party (see each pack's README),
#           one picked per placement; or `shape`, one of the simple shapes
#           blender/make_catalogue.py makes itself, with a `colour`
#   scale   how big the model is drawn, times its own size
#
# What it means to the engine, in the words of the world's data files:
#   material, composition, kind, fixed, mass, pieces, grows, and, for people
#   and creatures, culture, rules, temperature.
#   each    for a source: the mass each drawn model stands for, so a stand of
#           12 trees at 1 t each holds 12 t; placing more trees adds more.
#           Without it, a source's mass is `mass` (a placement can change it).
#   grows   for a source that grows back: `rate` a day, `limit` as a share of
#           its placed mass, and `from` the entry of the source it draws on
#           (the nearest one in the same place).

# Things -------------------------------------------------------------------

[[entry]]
id = "landmark-rock"
is = "thing"
label = "a big rock"
material = "rock"
mass = "2 t"
fixed = true
models = [
    "quaternius/stylized-nature-megakit/glTF/Rock_Medium_1.gltf",
    "quaternius/stylized-nature-megakit/glTF/Rock_Medium_2.gltf",
    "quaternius/stylized-nature-megakit/glTF/Rock_Medium_3.gltf",
]
scale = 0.8

[[entry]]
id = "player"
is = "thing"
label = "the islander"
kind = "human"
culture = "islanders"
temperature = "310 K"
rules = "player"
shape = "person"
colour = "#d9a066"

[[entry]]
id = "boar"
is = "thing"
label = "a boar"
kind = "boar"
temperature = "311 K"
shape = "beast"
colour = "#5a3a22"

