# The "where am I?" challenge: someone wakes on a beach with nothing, and
# doesn't know where they are. See docs/challenges/where-am-i.md. It's the
# stranded island (stranded.toml), shared through island-things.toml, with a
# castaway who has to find their way. This file grows stage by stage.
#
# Stage 1, day, night, and sleep: as on the stranded island. 24 hours, the sun
# up from 06:00 to 18:00, starting at 08:00; 300 K at midday and 292 K at
# midnight. A body stays awake 16 hours for 8 hours' sleep.
#
# Stage 2, an unknown island: the castaway knows no way out of anywhere. One
# search around takes 30 minutes and finds the nearest unknown way out six
# times in ten. Walking a way teaches the way back.
#
# Stage 3, carrying water: a clay pot, fired hard, holds 2 kg.
#
# Stage 4, the climb: a mountain rises behind the hillside. Wooded slopes
# 5 km away at 600 m, a bare ridge 5 km further at 1,200 m, and the summit
# 3 km beyond at 1,800 m. Temperatures are given as at sea level; the air
# cools 6.5 K for every km of height, so the summit is about 12 K colder than
# the beach, and its nights near 280 K.
# There's no water above the stream, and no wood above the slopes.
#
# Stage 5, the view: places have positions, in km east and north of the
# beach. Landmarks, places with a look from afar, can be seen when they're
# within the viewer's horizon plus their own, on a planet of Earth's size.
# From the beach: the next island and the mountain. From the summit: reef
# islands 25 km south-east, an island with smoke rising 60 km north-east,
# and a high island 120 km north. None of them can be reached yet.

uses = ["island-things.toml"]

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
max_touch_temperature = "330 K"
seed = 1
air_clearing = "0.1%"
calm_step = "1 min"
convection = "10 W/(m2*K)"
emissivity = "90%"
touch_transfer = "100 W/(m2*K)"
wear_rate = "10 mg/s"
friction_share = "50%"
rubbing_time = "10 min"
flame_share = "50%"
hand_hardness = "1"
explore_time = "30 min"
explore_chance = "60%"
lapse_rate = "6.5 K/km"
planet_radius = "6371 km"
eye_height = "1.7 m"
survey_time = "10 min"
