[[command]]
name = "designs"
group = "Testing"
summary = "the designs in this world and what they need"
usage = ["designs"]
about = """
Lists every design the world knows and its parts: what could be made, whether or not you know how."""
examples = ["designs"]
see = ["assemble", "scope"]

[[command]]
name = "scope"
group = "Testing"
summary = "everything your character could put to use"
usage = ["scope"]
about = """
What a translator from plain words to commands is given: the commands, your words, the ways you know to make things, what you carry, remember, and see. Nothing you couldn't know."""
examples = ["scope"]
see = ["designs", "recall"]

[[command]]
name = "time"
group = "Testing"
summary = "how long the world has been running"
usage = ["time"]
about = """
How many seconds the world has run. "look" gives the day and time of day."""
examples = ["time"]
