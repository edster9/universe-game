# The skill grounds: a sandbox for training skills, played in real time at
# x1. The player starts in a clearing; five grounds lie around it, each
# about 30 m away, half a minute's walk, with everything its skills need
# within a few steps. See docs/challenges/skill-grounds.md.
#
#                  the woodland
#                  (trees, boars)
#                        |
#   the knapping ground --- the clearing --- the fibre grove
#   (flint, stones, sticks)   (start)        (bushes, sticks)
#                     /             \
#            the hearth            the stream bank
#   (grass, twigs, sticks, logs,   (water, fish, mussels,
#    stones)                        clay, bog iron)
#
# Gathering takes seconds, and food a minute or so, so the whole ladder can
# be played in an evening.

uses = ["island-things.toml"]

[world]
reference_temperature = "293 K"
open_air_heat_loss = "5 W/K"
max_touch_temperature = "330 K"
seed = 1
air_clearing = "0.1%"
calm_step = "1 min"
convection = "10 W/(m2*K)"
emissivity = "90%"
touch_transfer = "100 W/(m2*K)"
wear_rate = "10 mg/s"
friction_share = "50%"
rubbing_time = "10 min"
flame_share = "50%"
hand_hardness = "1"
explore_time = "30 min"
explore_chance = "60%"
lapse_rate = "6.5 K/km"
planet_radius = "6371 km"
eye_height = "1.7 m"
survey_time = "10 min"
wound_rate = "20 g/s"
hit_chance = "60%"
hand_push = "5%"
drag = "300%"
day = "24 h"
starts_at = "8 h"
sunrise = "6 h"
sunset = "18 h"
# Ground rough enough to hurt bare feet: the mountain's stony paths. Sand
# and the forest floor don't. Each place's roughness is how much of a sole a
# km of walking there wears away.
bare_feet_limit = "8 g/km"
bare_feet_pace = "50%"
bare_feet_wound = "20 mg/s"
covers = "2 kg"

# Each ground reaches 12 m from its middle: its stocks lie a few steps
# apart.

[[place]]
id = "clearing"
label = "the clearing"
exits = ["woodland", "knapping", "grove", "stream", "hearth"]
distances = { woodland = "30 m", knapping = "30 m", grove = "30 m", stream = "30 m", hearth = "30 m" }
east = "0 m"
north = "0 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[place]]
id = "woodland"
label = "the woodland"
exits = ["clearing", "knapping", "grove"]
distances = { knapping = "42 m", grove = "42 m" }
east = "0 m"
north = "30 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[place]]
id = "knapping"
label = "the knapping ground"
exits = ["clearing", "woodland", "hearth"]
distances = { hearth = "23 m" }
east = "-30 m"
north = "0 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[place]]
id = "grove"
label = "the fibre grove"
exits = ["clearing", "woodland", "stream"]
distances = { stream = "23 m" }
east = "30 m"
north = "0 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[place]]
id = "stream"
label = "the stream bank"
exits = ["clearing", "grove", "hearth"]
distances = { hearth = "42 m" }
east = "21 m"
north = "-21 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[place]]
id = "hearth"
label = "the hearth"
exits = ["clearing", "knapping", "stream"]
east = "-21 m"
north = "-21 m"
size = "12 m"
temperature = "300 K"
night = "292 K"

[[agent]]
id = "player"
label = "the islander"
at = "clearing"
kind = "human"
culture = "islanders"
temperature = "310 K"
rules = "player"

# Two boars, keeping to the woodland: to hunt, and to keep food from.
[[agent]]
id = "boar"
label = "a boar"
at = "woodland"
kind = "boar"
count = 2
temperature = "311 K"
range = ["woodland"]

# The hearth: everything a fire needs, tinder to logs, and stones for a ring.
[[item]]
id = "hearth-grass"
label = "dry grass"
at = "hearth"
spot = "4 m north"
spread = "2 m"
mass = "20 kg"
fixed = true
material = "grass"
pieces = { size = "5 g", find_time = "3 s" }

[[item]]
id = "hearth-twigs"
label = "dry twigs"
at = "hearth"
spot = "4 m east"
spread = "2 m"
mass = "20 kg"
fixed = true
material = "wood"
pieces = { size = "20 g", find_time = "3 s" }

[[item]]
id = "hearth-sticks"
label = "fallen sticks"
at = "hearth"
spot = "4 m south"
spread = "2 m"
mass = "50 kg"
fixed = true
material = "wood"
pieces = { size = "200 g", find_time = "4 s" }

[[item]]
id = "hearth-logs"
label = "deadwood"
at = "hearth"
spot = "4 m west"
spread = "2 m"
mass = "200 kg"
fixed = true
material = "wood"
pieces = { size = "3 kg", find_time = "8 s" }

[[item]]
id = "hearth-stones"
label = "loose stones"
at = "hearth"
spot = "3 m north, 3 m west"
spread = "2 m"
mass = "500 kg"
fixed = true
material = "stone"
pieces = { size = "1 kg", find_time = "5 s" }


# The knapping ground: flint to strike flakes from, stones to strike with,
# and sticks for shafts.
[[item]]
id = "flint"
label = "flint nodules"
at = "knapping"
spot = "4 m north"
spread = "2 m"
mass = "200 kg"
fixed = true
material = "flint"
pieces = { size = "500 g", find_time = "8 s" }

[[item]]
id = "knapping-stones"
label = "loose stones"
at = "knapping"
spot = "4 m east"
spread = "2 m"
mass = "500 kg"
fixed = true
material = "stone"
pieces = { size = "1 kg", find_time = "5 s" }

[[item]]
id = "knapping-sticks"
label = "fallen sticks"
at = "knapping"
spot = "4 m south"
spread = "2 m"
mass = "50 kg"
fixed = true
material = "wood"
pieces = { size = "200 g", find_time = "4 s" }


# The fibre grove: bushes to pull fibre from, and sticks for poles.
[[item]]
id = "bushes"
label = "fibrous bushes"
at = "grove"
spot = "4 m north"
spread = "3 m"
mass = "500 kg"
fixed = true
material = "fibre"
pieces = { size = "250 g", find_time = "10 s" }
kind = "shrub"

[[item]]
id = "grove-sticks"
label = "fallen sticks"
at = "grove"
spot = "4 m south"
spread = "2 m"
mass = "50 kg"
fixed = true
material = "wood"
pieces = { size = "200 g", find_time = "4 s" }


# The stream bank: water, fish for a spear, mussels, and the clay and bog
# iron a knife is made from.
[[item]]
id = "water"
label = "the stream's water"
at = "stream"
mass = "50 t"
fixed = true
material = "water"

[[item]]
id = "fish"
label = "fish in the stream"
at = "stream"
mass = "150 kg"
fixed = true
material = "fish"
pieces = { size = "500 g", find_time = "1 min", chance = "60%", needs = "spear" }
kind = "fish"

[[item]]
id = "mussels"
label = "mussels in the shallows"
at = "stream"
spot = "4 m south"
spread = "3 m"
mass = "100 kg"
fixed = true
composition = { shellfish = "35%", shell = "65%" }
pieces = { size = "1 kg", find_time = "30 s" }
kind = "shellfish"

[[item]]
id = "clay"
label = "clay in the bank"
at = "stream"
spot = "4 m east"
spread = "2 m"
mass = "500 kg"
fixed = true
material = "clay"
pieces = { size = "1 kg", find_time = "5 s" }

[[item]]
id = "bog-iron"
label = "bog iron in the streambed"
at = "stream"
spot = "4 m west"
spread = "2 m"
mass = "200 kg"
fixed = true
composition = { iron = "50%", rock = "50%" }
pieces = { size = "2 kg", find_time = "10 s" }


# The woodland: trees to fell with an axe, roots and nuts, and the boars.
[[item]]
id = "trees"
label = "standing trees"
at = "woodland"
mass = "20 t"
fixed = true
material = "wood"
pieces = { size = "20 kg", find_time = "3 min", edge = "1 mm", needs = "axe" }
kind = "tree"

[[item]]
id = "floor"
label = "the forest floor"
at = "woodland"
mass = "100 t"
fixed = true
material = "litter"

[[item]]
id = "forage"
label = "roots and nuts in the leaf litter"
at = "woodland"
spot = "4 m east"
spread = "3 m"
mass = "150 kg"
fixed = true
material = "roots"
pieces = { size = "500 g", find_time = "1 min", chance = "70%" }
grows = { rate = "20%", limit = "200 kg", from = "floor" }
